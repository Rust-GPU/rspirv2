[workspace]
members = [
	"crates/autogen",
	"crates/grammar",
	"crates/grammar-parser",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["rust-gpu developers"]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
autogen = { path = "crates/autogen" }
spirv-grammar = { path = "crates/grammar" }
spirv-grammar-parser = { path = "crates/grammar-parser" }

anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
