[package]
name = "rspirv2-grammar-parser"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
codegen = ["quote", "proc-macro2", "convert_case", "unicode-ident"]
prettyplease = ["dep:prettyplease", "dep:syn"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec = { workspace = true, features = ["serde"] }
quote = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }
convert_case = { workspace = true, optional = true }
unicode-ident = { workspace = true, optional = true }
prettyplease = { workspace = true, optional = true }
syn = { workspace = true, optional = true, default-features = false, features = ["parsing"] }
